<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Harga Emas">
<meta name="theme-color" content="#fbf7ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110a" media="(prefers-color-scheme: dark)">

<title>Harga Emas</title>
<style>
  :root{
    --bg:#fbf7ee; --card:#ffffff; --soft:#f6efdf; --fg:#2b2416; --muted:#7c7260; --line:#ece3cf;
    --gold:#b07d0e; --gold2:#e0b13a; --onGold:#2b1d00;
    --up:#1e9b6f; --upBg:#e3f6ee; --down:#d0443e; --downBg:#fde8e6; --flatBg:#f1ede4;
    --shadow:0 1px 2px rgba(60,40,0,.06),0 6px 20px rgba(60,40,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14110a; --card:#1f1a10; --soft:#2a2416; --fg:#f7f1e3; --muted:#a99d84; --line:#3a321f;
      --gold:#f1c34f; --gold2:#d9a52a; --onGold:#2b1d00;
      --up:#4cd3a0; --upBg:rgba(76,211,160,.13); --down:#ff7b72; --downBg:rgba(255,123,114,.13); --flatBg:#2a2416;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100dvh; background:var(--bg); color:var(--fg);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:460px;margin:0 auto}
  button{font:inherit;color:inherit}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  header h1{margin:0;font-size:22px;font-weight:750;display:flex;align-items:center;gap:10px}
  header h1 .coin{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#a8790f);display:grid;place-items:center;color:#fff8e0;font-size:12px;font-weight:800}
  .tools{display:flex;gap:8px;align-items:center}
  .lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:14px;font-weight:650;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
  .round{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
  .round.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 12px;font-size:17px;font-weight:700}

  /* purity chips */
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px -4px 16px;padding:2px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:650;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--gold2);border-color:var(--gold2);color:var(--onGold)}

  .hero .what{font-size:15px;color:var(--muted);font-weight:600}
  .hero .price{font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .hero .unit{font-size:16px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 14px;border-radius:999px;font-size:15.5px;font-weight:700;background:var(--flatBg);color:var(--muted)}
  .pill.up{background:var(--upBg);color:var(--up)}
  .pill.down{background:var(--downBg);color:var(--down)}
  .updated{font-size:13.5px;color:var(--muted);margin-top:12px}
  .alert{display:block;line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:14.5px;color:var(--muted)}
  .alert b{color:var(--fg)}
  .alert.hit{background:var(--upBg);color:var(--up)}
  .alert.hit b{color:var(--up)}

  /* calculator */
  .calc{display:flex;align-items:center;gap:10px}
  .in{flex:1;min-width:0;display:flex;align-items:center;background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:0 16px}
  .in:focus-within{border-color:var(--gold2)}
  .in input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--fg);font-size:24px;font-weight:700;padding:14px 0;outline:none;font-variant-numeric:tabular-nums}
  .in span{color:var(--muted);font-weight:650;white-space:nowrap;margin-left:6px}
  .result{margin-top:14px;font-size:15px;color:var(--muted)}
  .result b{display:block;font-size:30px;color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .small{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
  .fields{display:flex;gap:10px;margin-top:10px}
  .fields .in{flex:1}
  .in.sm input{font-size:20px;padding:11px 0}
  .unitsel{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:none}
  .unitsel button{border:0;background:none;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
  .unitsel button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
  .lines{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  .line{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
  .line b{color:var(--fg);white-space:nowrap}
  .line{gap:12px;align-items:baseline}
  .line.total{font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
  .line.total b{font-size:24px;font-weight:800}
  .good{color:var(--up)!important} .bad{color:var(--down)!important}

  /* collection */
  .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .sum div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
  .sum b{display:block;color:var(--fg);font-size:18px;font-variant-numeric:tabular-nums}
  .items{list-style:none;margin:0;padding:0}
  .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nm span{font-size:13px;color:var(--muted)}
  .item .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .item .val span{display:block;font-size:13px;font-weight:650}
  .empty{color:var(--muted);font-size:15px;text-align:center;padding:10px 0 4px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .form .full{grid-column:1/-1}
  .form label{display:block;font-size:12.5px;color:var(--muted);font-weight:650;margin-bottom:4px}
  .form input,.form select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
  .form input:focus{outline:none;border-color:var(--gold2)}
  .btns{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:750;font-size:16px;cursor:pointer;background:var(--soft);color:var(--fg)}
  .btn.primary{background:var(--gold2);color:var(--onGold)}
  .btn.danger{background:var(--downBg);color:var(--down);flex:none;padding:13px 16px}
  .linkbtns{display:flex;justify-content:center;gap:18px;margin-top:14px}
  .linkbtns button,.linkbtns label{border:0;background:none;color:var(--muted);font-size:13.5px;text-decoration:underline;cursor:pointer;padding:4px}

  /* chart */
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:10px;font-size:13.5px;font-weight:650;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
  #chart{width:100%;height:160px;display:block;touch-action:pan-y}
  .tip{text-align:center;font-size:15px;font-weight:650;min-height:22px;margin-top:8px;font-variant-numeric:tabular-nums}
  .lohi{display:flex;gap:10px;margin-top:12px}
  .lohi div{flex:1;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
  .lohi b{display:block;color:var(--fg);font-size:17px;font-variant-numeric:tabular-nums}

  /* table */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td{padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
  td:last-child{text-align:right;font-weight:700}
  td small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
  tr{cursor:pointer}
  tr.on td{color:var(--gold)}
  tr:last-child td{border-bottom:0}

  details{margin-top:4px}
  summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"＋";color:var(--muted);font-weight:400}
  details[open] summary::after{content:"－"}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .cell{background:var(--soft);border-radius:14px;padding:11px 12px;font-size:13px;color:var(--muted)}
  .cell b{display:block;color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:15px}
  select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}

  .err{background:var(--downBg);color:var(--down);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:14px;font-weight:600}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.6}
  .foot a{color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="coin">Au</span><span data-t="title"></span></h1>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ms">BM</button><button data-lang="en">EN</button>
      </div>
      <button class="round" id="refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="err" id="err" hidden></div>

  <!-- TODAY -->
  <section class="card hero">
    <div class="chips" id="chips"></div>
    <div class="what" id="what"></div>
    <div class="price" id="price">—</div>
    <div class="unit" data-t="perGram"></div>
    <div class="pill" id="pill">…</div>
    <div class="updated" id="updated"></div>
    <div class="alert" id="alert" hidden></div>
  </section>

  <!-- CALCULATORS -->
  <section class="card">
    <h2 data-t="calcTitle"></h2>
    <div class="seg" id="mode">
      <button data-m="worth"></button><button data-m="shop"></button><button data-m="check"></button>
    </div>
    <div class="calc">
      <label class="in">
        <input id="grams" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="grams">
        <span data-t="grams"></span>
      </label>
    </div>
    <div class="fields" id="f-worth">
      <label class="in sm"><input id="buyback" type="text" inputmode="decimal" placeholder="93" aria-label="buyback"><span data-t="buybackLbl"></span></label>
    </div>
    <div class="fields" id="f-shop">
      <label class="in sm"><input id="upah" type="text" inputmode="decimal" placeholder="0" aria-label="upah"><span data-t="upahLbl"></span></label>
      <div class="unitsel" id="upahUnit"><button data-u="rm">RM/g</button><button data-u="pct">%</button></div>
    </div>
    <div class="fields" id="f-check">
      <label class="in sm"><span style="margin:0 6px 0 0">RM</span><input id="quote" type="text" inputmode="decimal" placeholder="0" aria-label="quote"><span data-t="quoteLbl"></span></label>
    </div>
    <div class="lines" id="calcOut" hidden></div>
    <p class="small" id="calcNote"></p>
  </section>

  <!-- COLLECTION -->
  <section class="card">
    <h2 data-t="colTitle"></h2>
    <div class="sum" id="colSum" hidden></div>
    <ul class="items" id="items"></ul>
    <details id="addBox">
      <summary id="addSummary"></summary>
      <form class="form" id="itemForm" autocomplete="off">
        <div class="full"><label for="i-name" data-t="iName"></label><input id="i-name" maxlength="60" required></div>
        <div><label for="i-g" data-t="iGrams"></label><input id="i-g" inputmode="decimal" required></div>
        <div><label for="i-p" data-t="iPurity"></label><select id="i-p"></select></div>
        <div><label for="i-cost" data-t="iCost"></label><input id="i-cost" inputmode="decimal"></div>
        <div><label for="i-date" data-t="iDate"></label><input id="i-date" type="date"></div>
        <div class="full btns">
          <button type="button" class="btn danger" id="i-del" hidden>🗑</button>
          <button type="button" class="btn" id="i-cancel" data-t="cancel"></button>
          <button type="submit" class="btn primary" data-t="save"></button>
        </div>
      </form>
    </details>
    <p class="small" data-t="colNote"></p>
    <div class="linkbtns">
      <button type="button" id="exportBtn" data-t="backup"></button>
      <label><span data-t="restore"></span><input type="file" id="importFile" accept="application/json,.json" hidden></label>
    </div>
  </section>

  <!-- TREND -->
  <section class="card">
    <h2 data-t="trendTitle"></h2>
    <div class="seg" id="range">
      <button data-d="7"></button><button data-d="30"></button><button data-d="90"></button><button data-d="180"></button><button data-d="365"></button>
    </div>
    <svg id="chart" viewBox="0 0 400 160" preserveAspectRatio="none"></svg>
    <div class="tip" id="tip">&nbsp;</div>
    <div class="lohi">
      <div><span data-t="lowest"></span><b id="lo">—</b></div>
      <div><span data-t="highest"></span><b id="hi">—</b></div>
    </div>
  </section>

  <!-- ALL PURITIES -->
  <section class="card">
    <h2 data-t="allTitle"></h2>
    <table><tbody id="all"></tbody></table>
  </section>

  <!-- MORE -->
  <section class="card">
    <details>
      <summary data-t="more"></summary>
      <div class="grid">
        <div class="cell"><span data-t="pure"></span><b id="d-pure">—</b></div>
        <div class="cell"><span data-t="oz"></span><b id="d-oz">—</b></div>
        <div class="cell"><span data-t="tael"></span><b id="d-tael">—</b></div>
        <div class="cell"><span data-t="spot"></span><b id="d-usd">—</b></div>
      </div>
      <div class="row"><span data-t="currency"></span>
        <select id="cur" aria-label="Currency">
          <option value="myr">RM (MYR)</option><option value="sgd">SGD</option><option value="usd">USD</option>
          <option value="idr">IDR</option><option value="eur">EUR</option><option value="gbp">GBP</option>
        </select>
      </div>
    </details>
  </section>

  <p class="foot"><span data-t="foot"></span><br>
    <span data-t="source"></span> <a href="https://github.com/fawazahmed0/exchange-api" target="_blank" rel="noopener">exchange-api</a> ·
    <a href="https://gold-api.com" target="_blank" rel="noopener">gold-api.com</a>
  </p>
</div>

    lowest:'Lowest', highest:'Highest', overPeriod:'over', tapHint:'Touch the chart to see that day’s price',
    allTitle:'All gold types (per gram)', more:'More details',
    pure:'Pure gold / gram', oz:'One ounce (31.1 g)', tael:'One tael (37.5 g)', spot:'World price (USD/oz)',
    currency:'Currency',
    foot:'Market gold price, not the shop price. Shops add workmanship and other charges.', source:'Data:',
    errOld:'Couldn’t update — showing the last saved prices.',
    errNone:'Couldn’t load prices. Check the internet and tap refresh.',
    alertSet:'Telegram alert when {p} gold is below', alertHit:'Price is below your target',
  },
};

const CACHE = 'goldPrice.cache.v1';
const PREFS = 'goldPrice.prefs.v2';
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const prefs = Object.assign({ cur:'myr', days:30, purity:'916', lang:'ms', grams:'', mode:'worth', buyback:'93', upah:'', upahUnit:'rm', quote:'' }, store.get(PREFS) || {});
const ITEMS = 'goldPrice.items.v1';
let items = store.get(ITEMS) || [];
const saveItems = () => store.set(ITEMS, items);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '.').replace(/[^0-9.]/g, '')); return isFinite(n) ? n : NaN; };
const savePrefs = () => store.set(PREFS, prefs);
let cache = store.get(CACHE) || { hist:{}, live:null };
let alertCfg = null;   // from alert.json (the target used by the email alert)
fetch('alert.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null)
  .then(j => { if (j && j.enabled !== false && +j.below > 0){ alertCfg = j; render(); } }).catch(() => {});
const t = k => T[prefs.lang][k];

const dailyUrls = tag => [
  `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/xau.min.json`,
  `https://${tag}.currency-api.pages.dev/v1/currencies/xau.min.json`,
];
const iso = d => d.toISOString().slice(0,10);
const daysAgo = n => { const d = new Date(); d.setUTCDate(d.getUTCDate() - n); return iso(d); };

async function getJson(urls, ms = 9000){
  for (const u of urls){
    try {
      const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
      const r = await fetch(u, { signal: ctl.signal, cache:'no-cache' });
      clearTimeout(tm);
      if (r.ok) return await r.json();
    } catch {}
  }
  throw new Error('unreachable');
}
async function fetchDay(tag){
  const j = await getJson(dailyUrls(tag));
  if (!j || !j.xau) throw new Error('bad data');
  return { date: j.date || tag, rates: j.xau };
}
async function fetchLive(){
  try {
    const j = await getJson(['https://api.gold-api.com/price/XAU'], 7000);
    if (j && typeof j.price === 'number') return { usd: j.price, at: j.updatedAt || new Date().toISOString() };
  } catch {}
  return null;
}

let failed = false;
async function update(){
  $('refresh').classList.add('spin');
  failed = false;
  try {
    const latest = await fetchDay('latest');
    cache.hist[latest.date] = latest.rates;
    // Daily points up to 3 months; every 3rd day for 6 months, every 7th day for 1 year
    // (past days never change, so each one is downloaded only once and then kept).
    const need = [];
    const step = prefs.days <= 90 ? 1 : prefs.days <= 180 ? 3 : 7;
    for (let i = 1; i <= prefs.days; i++){
      if (i > 30 && i % step) continue;
      const tag = daysAgo(i);
      if (tag < latest.date && !cache.hist[tag]) need.push(tag);
    }
    for (let i = 0; i < need.length; i += 12){   // a few at a time, to be gentle on the data source
      const got = await Promise.allSettled(need.slice(i, i + 12).map(fetchDay));
      got.forEach(g => { if (g.status === 'fulfilled') cache.hist[g.value.date] = g.value.rates; });
    }

    const keep = ['myr','usd','sgd','idr','eur','gbp'];
    const oldest = daysAgo(372);
    const dates = Object.keys(cache.hist).sort().filter(d => d >= oldest);
    cache.hist = Object.fromEntries(dates.map(d => [d, Object.fromEntries(keep.map(c => [c, cache.hist[d][c]]))]));
    cache.live = await fetchLive() || cache.live;
    cache.fetchedAt = new Date().toISOString();
    store.set(CACHE, cache);
  } catch { failed = true; }
  finally { $('refresh').classList.remove('spin'); render(); }
}

// ---------- formatting ----------
const locale = () => prefs.lang === 'ms' ? 'ms-MY' : 'en-MY';
function money(v, cur = prefs.cur, dp){
  if (v == null || !isFinite(v)) return '—';
  if (dp == null) dp = v >= 100000 ? 0 : 2;
  const num = new Intl.NumberFormat(locale(), { minimumFractionDigits:dp, maximumFractionDigits:dp }).format(v);
  if (cur === 'myr') return 'RM ' + num;
  try { return new Intl.NumberFormat(locale(), { style:'currency', currency:cur.toUpperCase(), minimumFractionDigits:dp, maximumFractionDigits:dp }).format(v); }
  catch { return cur.toUpperCase() + ' ' + num; }
}
const niceDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString(locale(), { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' });
function timeStr(d){
  const same = d.toDateString() === new Date().toDateString();
  return same ? d.toLocaleTimeString(locale(), { hour:'numeric', minute:'2-digit' })
              : d.toLocaleString(locale(), { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
}
const purity = () => PURITIES.find(p => p.k === prefs.purity) || PURITIES[0];

// ---------- prices ----------
// Returns per-gram PURE gold price now (live-adjusted) and yesterday, in the chosen currency.
function prices(){
  const dates = Object.keys(cache.hist).sort();
  if (!dates.length) return null;
  const today = dates[dates.length-1], prev = dates[dates.length-2];
  const td = cache.hist[today], yd = prev ? cache.hist[prev] : null;
  let oz = td[prefs.cur];
  if (cache.live && td.usd) oz = oz * (cache.live.usd / td.usd);
  return { now: oz / OZ, before: yd && yd[prefs.cur] ? yd[prefs.cur] / OZ : null, today, dates };
}

// ---------- render ----------
function applyText(){
  document.documentElement.lang = prefs.lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('#range button').forEach(b => { b.textContent = t('d' + b.dataset.d); b.classList.toggle('on', +b.dataset.d === prefs.days); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === prefs.lang));
  document.querySelectorAll('#mode button').forEach(b => { b.textContent = t('m_' + b.dataset.m); b.classList.toggle('on', b.dataset.m === prefs.mode); });
  ['worth','shop','check'].forEach(m => $('f-' + m).hidden = m !== prefs.mode);
  document.querySelectorAll('#upahUnit button').forEach(b => b.classList.toggle('on', b.dataset.u === prefs.upahUnit));
  $('calcNote').textContent = t('note' + prefs.mode[0].toUpperCase() + prefs.mode.slice(1));
  $('addSummary').textContent = editing ? t('editItem') : t('addItem');
  $('chips').innerHTML = PURITIES.map(p => `<button class="chip ${p.k===prefs.purity?'on':''}" data-p="${p.k}">${p.k}</button>`).join('');
}

function render(){
  applyText();
  const P = prices();
  $('err').hidden = !failed;
  if (failed) $('err').textContent = P ? t('errOld') : t('errNone');
  if (!P){ $('pill').textContent = t('loading'); return; }

  const pu = purity();
  const g = P.now * pu.f;
  $('what').textContent = `${t('gold')} ${pu.k} (${pu.karat}) · ${t('today')}`;
  $('price').textContent = money(g);

  const pill = $('pill');
  if (P.before){
    const diff = g - P.before * pu.f;
    const pct = diff / (P.before * pu.f) * 100;
    if (Math.abs(pct) < 0.01){ pill.className = 'pill'; pill.textContent = '• ' + t('same'); }
    else {
      const up = diff > 0;
      pill.className = 'pill ' + (up ? 'up' : 'down');
      pill.textContent = `${up ? '▲' : '▼'} ${t(up ? 'up' : 'down')} ${money(Math.abs(diff))} ${t('sinceY')}`;
    }
  } else { pill.className = 'pill'; pill.textContent = '—'; }

  const when = cache.fetchedAt ? new Date(cache.fetchedAt) : null;
  $('updated').textContent = when ? `${t('updated')} ${timeStr(when)}` : '';

  // email-alert target
  const al = $('alert');
  if (alertCfg){
    const ap = PURITIES.find(p => p.k === String(alertCfg.purity)) || PURITIES[0];
    const td = cache.hist[P.today];   // the target is in RM, whatever currency is shown
    const pureMyr = td.myr ? td.myr * (cache.live && td.usd ? cache.live.usd / td.usd : 1) / OZ : null;
    const hit = pureMyr != null && pureMyr * ap.f < +alertCfg.below;
    al.hidden = false;
    al.className = 'alert' + (hit ? ' hit' : '');
    al.innerHTML = `🔔 ${hit ? `<b>${t('alertHit')}</b><br>` : ''}${t('alertSet').replace('{p}', ap.k)} <b>${money(+alertCfg.below, 'myr')}</b>`;
  } else al.hidden = true;

  renderCalc(g, pu);
  renderCollection();

  // all purities
  $('all').innerHTML = PURITIES.map(p => `
    <tr data-p="${p.k}" class="${p.k===prefs.purity?'on':''}">
      <td>${t('gold')} ${p.k}<small>${p.karat}</small></td><td>${money(P.now * p.f)}</td>
    </tr>`).join('');

  // details
  const oz = P.now * OZ;
  $('d-pure').textContent = money(P.now);
  $('d-oz').textContent = money(oz);
  $('d-tael').textContent = money(P.now * 37.5);
  $('d-usd').textContent = money(cache.live ? cache.live.usd : cache.hist[P.today].usd, 'usd');
  $('cur').value = prefs.cur;

  drawChart(pu);
}

// Pure-gold price per gram in RM (live-adjusted), whatever display currency is chosen.
function pureMyrNow(){
  const dates = Object.keys(cache.hist).sort();
  if (!dates.length) return null;
  const td = cache.hist[dates[dates.length-1]];
  return td.myr ? td.myr * (cache.live && td.usd ? cache.live.usd / td.usd : 1) / OZ : null;
}
const line = (label, value, cls = '') => `<div class="line ${cls}"><span>${label}</span><b>${value}</b></div>`;

function renderCalc(g, pu){
  const out = $('calcOut'), grams = num(prefs.grams);
  if (!(grams > 0)){ out.hidden = true; return; }
  const value = grams * g, label = `${grams} g · ${pu.k}`;
  let html = '';
  if (prefs.mode === 'worth'){
    const bb = num(prefs.buyback) > 0 ? num(prefs.buyback) : 93;
    html = line(`${t('goldValue')} (${label})`, money(value), 'total') +
           line(`${t('buybackEst')} (${bb}%)`, money(value * bb / 100));
  } else if (prefs.mode === 'shop'){
    const u = num(prefs.upah) || 0;
    const upah = prefs.upahUnit === 'pct' ? value * u / 100 : grams * u;
    html = line(`${t('goldValue')} (${label})`, money(value)) +
           line(`${t('upahAmt')} (${prefs.upahUnit === 'pct' ? u + '%' : money(u) + '/g'})`, money(upah)) +
           line(t('shopEst'), money(value + upah), 'total');
  } else {
    const q = num(prefs.quote);
    if (!(q > 0)){ out.hidden = true; return; }
    const upah = q - value;
    html = line(`${t('goldValue')} (${label})`, money(value)) + line(t('shopTotal'), money(q)) +
      (upah < 0 ? `<p class="small bad">${t('belowMarket')}</p>`
                : line(t('upahPerG'), money(upah / grams) + '/g', 'total') +
                  line(t('overMarket'), `${money(upah)} (${(upah / value * 100).toFixed(1)}%)`));
  }
  out.innerHTML = html; out.hidden = false;
}

// ---------- collection ----------
let editing = null;   // id of the item being edited
function renderCollection(){
  const pm = pureMyrNow();
  const fp = k => (PURITIES.find(p => p.k === k) || PURITIES[0]).f;
  if (!items.length){ $('items').innerHTML = `<li class="empty">${t('empty')}</li>`; $('colSum').hidden = true; return; }
  let tw = 0, tv = 0, tc = 0, tvc = 0;
  $('items').innerHTML = items.map(it => {
    const v = pm != null ? it.g * fp(it.p) * pm : null;
    tw += it.g; if (v != null) tv += v;
    if (it.cost > 0 && v != null){ tc += it.cost; tvc += v; }
    const d = it.cost > 0 && v != null ? v - it.cost : null;
    return `<li class="item" data-id="${esc(it.id)}">
      <div class="nm"><b>${esc(it.name)}</b><span>${it.g} g · ${esc(it.p)}${it.cost > 0 ? ' · ' + money(it.cost, 'myr') : ''}${it.date ? ' · ' + esc(it.date) : ''}</span></div>
      <div class="val">${money(v, 'myr')}${d != null ? `<span class="${d >= 0 ? 'good' : 'bad'}">${d >= 0 ? '+' : '−'}${money(Math.abs(d), 'myr')}</span>` : ''}</div>
    </li>`;
  }).join('');
  const gain = tc > 0 ? tvc - tc : null;
  $('colSum').hidden = false;
  $('colSum').innerHTML =
    `<div>${t('totalWeight')}<b>${+tw.toFixed(2)} g</b></div><div>${t('nowValue')}<b>${money(tv, 'myr')}</b></div>` +
    (tc > 0 ? `<div>${t('paid')}<b>${money(tc, 'myr')}</b></div><div>${t('gain')}<b class="${gain >= 0 ? 'good' : 'bad'}">${gain >= 0 ? '+' : '−'}${money(Math.abs(gain), 'myr')}</b></div>` : '');
}
function openForm(it){
  editing = it ? it.id : null;
  $('i-name').value = it?.name || ''; $('i-g').value = it?.g || ''; $('i-p').value = it?.p || prefs.purity;
  $('i-cost').value = it?.cost || ''; $('i-date').value = it?.date || '';
  $('i-del').hidden = !it;
  $('addBox').open = true;
  applyText();
  $('addBox').scrollIntoView({ behavior:'smooth', block:'center' });
}
function closeForm(){ editing = null; $('itemForm').reset(); $('addBox').open = false; applyText(); }

let chartDefault = '';
function drawChart(pu){
  const svg = $('chart');
  const cutoff = daysAgo(prefs.days);
  const pts = Object.keys(cache.hist).sort().filter(d => d >= cutoff && cache.hist[d][prefs.cur])
    .map(d => ({ d, v: cache.hist[d][prefs.cur] / OZ * pu.f }));
  if (pts.length < 2){ svg.innerHTML = ''; $('lo').textContent = $('hi').textContent = '—'; $('tip').innerHTML = '&nbsp;'; return; }

  const W = 400, H = 160, Pd = 10;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d), tspan = (t1 - t0) || 1;
  const x = i => Pd + (Date.parse(pts[i].d) - t0) / tspan * (W - 2*Pd);
  const y = v => H - Pd - (v - lo) / span * (H - 2*Pd);
  const line = pts.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  svg.innerHTML = `
    <defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e0b13a" stop-opacity=".35"/><stop offset="1" stop-color="#e0b13a" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${x(pts.length-1)},${H}L${x(0)},${H}Z" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cross" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>`;

  const loP = pts[vs.indexOf(lo)], hiP = pts[vs.indexOf(hi)];
  $('lo').innerHTML = `${money(lo)}<small style="display:block;font-weight:500;font-size:12px;color:var(--muted)">${niceDate(loP.d)}</small>`;
  $('hi').innerHTML = `${money(hi)}<small style="display:block;font-weight:500;font-size:12px;color:var(--muted)">${niceDate(hiP.d)}</small>`;
  chartDefault = t('tapHint');
  $('tip').textContent = chartDefault;
  $('tip').style.color = 'var(--muted)';

  const pick = ev => {
    const r = svg.getBoundingClientRect();
    const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    let i = 0;
    pts.forEach((_, j) => { if (Math.abs(x(j) - cx) < Math.abs(x(i) - cx)) i = j; });
    const c = $('cross'); c.setAttribute('x1', x(i)); c.setAttribute('x2', x(i)); c.setAttribute('opacity', '.7');
    $('tip').textContent = `${niceDate(pts[i].d)} · ${money(pts[i].v)}`;
    $('tip').style.color = 'var(--fg)';
  };
  svg.onmousemove = svg.ontouchmove = svg.ontouchstart = pick;
  svg.onmouseleave = svg.ontouchend = () => { $('cross').setAttribute('opacity', '0'); $('tip').textContent = chartDefault; $('tip').style.color = 'var(--muted)'; };
}

// ---------- events ----------
function choosePurity(k){ prefs.purity = k; savePrefs(); render(); if (navigator.vibrate) navigator.vibrate(15); }
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) choosePurity(b.dataset.p); });
$('all').addEventListener('click', e => { const r = e.target.closest('[data-p]'); if (r){ choosePurity(r.dataset.p); window.scrollTo({ top:0, behavior:'smooth' }); } });
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { prefs.lang = b.dataset.lang; savePrefs(); render(); }));
document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => { prefs.days = +b.dataset.d; savePrefs(); render(); update(); }));
$('cur').addEventListener('change', e => { prefs.cur = e.target.value; savePrefs(); render(); });
$('refresh').addEventListener('click', update);
['grams','buyback','upah','quote'].forEach(id => {
  $(id).value = prefs[id];
  $(id).addEventListener('input', e => { prefs[id] = e.target.value.replace(/[^0-9.,]/g, ''); e.target.value = prefs[id]; savePrefs(); render(); });
});
document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => { prefs.mode = b.dataset.m; savePrefs(); render(); }));
document.querySelectorAll('#upahUnit button').forEach(b => b.addEventListener('click', () => { prefs.upahUnit = b.dataset.u; savePrefs(); render(); }));

$('i-p').innerHTML = PURITIES.map(p => `<option value="${p.k}">${p.k} (${p.karat})</option>`).join('');
$('addBox').addEventListener('toggle', () => { if (!$('addBox').open && editing){ editing = null; $('itemForm').reset(); applyText(); } });
$('items').addEventListener('click', e => { const li = e.target.closest('[data-id]'); if (li) openForm(items.find(i => i.id === li.dataset.id)); });
$('itemForm').addEventListener('submit', e => {
  e.preventDefault();
  const g = num($('i-g').value);
  if (!(g > 0)){ $('i-g').focus(); return; }
  const it = { id: editing || Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: $('i-name').value.trim() || '—', g, p: $('i-p').value, cost: num($('i-cost').value) || 0, date: $('i-date').value };
  const ix = items.findIndex(i => i.id === it.id);
  ix >= 0 ? items[ix] = it : items.push(it);
  saveItems(); closeForm(); render();
});
$('i-cancel').addEventListener('click', closeForm);
$('i-del').addEventListener('click', () => {
  if (!confirm(t('confirmDel'))) return;
  items = items.filter(i => i.id !== editing); saveItems(); closeForm(); render();
});
$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ app:'harga-emas', items }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `koleksi-emas-${iso(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const list = (Array.isArray(j) ? j : j.items).filter(i => i && num(i.g) > 0).map(i => ({
      id: String(i.id || Math.random().toString(36).slice(2)), name: String(i.name || '—').slice(0, 60), g: num(i.g),
      p: PURITIES.some(p => p.k === String(i.p)) ? String(i.p) : '916', cost: num(i.cost) || 0, date: String(i.date || '').slice(0, 10) }));
    items = list; saveItems(); render(); alert(t('restored').replace('{n}', list.length));
  } catch { alert(t('badFile')); }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// Show saved prices instantly, then fetch fresh ones; re-check when reopened and every 30 min.
render();
update();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (!cache.fetchedAt || Date.now() - new Date(cache.fetchedAt) > 10*60*1000)) update();
});
setInterval(() => { if (document.visibilityState === 'visible') update(); }, 30*60*1000);
</script>
</body>
