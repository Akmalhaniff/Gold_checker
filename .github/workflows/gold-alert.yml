name: Gold price alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (also reads /sasaran messages sent to the bot)
  workflow_dispatch:
    inputs:
      below:
        description: "Harga sasaran baru (RM segram), cth 470 — kosongkan jika tak tukar"
        type: string
        required: false
        default: ""
      purity:
        description: "Jenis emas (kosong = tak tukar)"
        type: choice
        options: ["", "916", "999", "835", "750", "375"]
        default: ""
      test:
        description: "Hantar mesej ujian sekarang"
        type: boolean
        default: false

permissions:
  contents: write   # to save alert.json / alert-state.json

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check price, read bot messages, send alert if below target
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FORCE_TEST: ${{ inputs.test && '1' || '0' }}
          INPUT_BELOW: ${{ inputs.below }}
          INPUT_PURITY: ${{ inputs.purity }}
        run: python3 scripts/gold_alert.py

      - name: Save target and alert state
        if: always()
        run: |
          if [ -n "$(git status --porcelain alert.json alert-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alert.json alert-state.json
            git commit -m "Update gold alert target/state [skip ci]"
            git pull --rebase --quiet
            git push
          fi
