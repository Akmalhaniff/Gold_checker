name: Gold price alert

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC), at minute 17
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email now (ignores the target)"
        type: boolean
        default: false

permissions:
  contents: write   # to save alert-state.json so the same alert is not emailed every hour

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check price and email if below target
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FORCE_TEST: ${{ inputs.test && '1' || '0' }}
        run: python3 scripts/gold_alert.py

      - name: Save alert state
        run: |
          if [ -n "$(git status --porcelain alert-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alert-state.json
            git commit -m "Update gold alert state [skip ci]"
            git push
          fi
